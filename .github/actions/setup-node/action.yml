name: 'Setup Node.js Environment'
description: 'Sets up Node.js environment with caching'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.14.0'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Cache node_modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: |
        for i in 1 2 3; do
          npm ci --legacy-peer-deps && break || {
            if [ $i -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed, retrying in 5 seconds... (attempt $i/3)"
            sleep 5
          }
        done
      shell: bash
